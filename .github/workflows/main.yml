
name: Build Shine AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Android project
        run: |
          echo "Checking Shine AI project..."
          unzip -l ShineAI_OneClick_Android_Build.zip
          mkdir -p build-source
          unzip -q ShineAI_OneClick_Android_Build.zip -d build-source
          find build-source -type f | head -100
          if ! find build-source -type f \( -name gradlew -o -name build.gradle -o -name build.gradle.kts \) | grep -q .; then
            echo "::error::Android Gradle build files are missing from the ZIP."
            exit 1
          fi
          echo "Project files found. Full Android build setup may still be required."
